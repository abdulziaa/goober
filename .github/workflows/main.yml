name: Build LaTeX documentation
on: [push]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Check if goober.tex changed since last commit on main branch.
      # avoid compiling the code and filling up commit history with unnecessary commits
        id: check_changes
        run: |
          if git diff --name-only origin/main HEAD | grep -q "docs/goober.tex"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Compile LaTeX document
        if: steps.check_changes.outputs.changed == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: docs/goober.tex
          work_in_root_file_dir: true
      
      - name: Upload PDF file
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: PDF
          path: docs/goober.pdf
      
      - name: Commit PDF to repository
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/goober.pdf
          git diff --quiet && git diff --staged --quiet || git commit -m "Upload compiled documentation to repository. See commit ${{ github.sha }} [skip ci]"
          git push